name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install check dependencies
        run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - name: Lint scripts and tests
        run: python -m ruff check --isolated --no-cache --select E9,F63,F7,F82,F401 scripts tests
      - name: Check specification, contract, schemas and examples
        run: python scripts/check_spec.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build specification bundle
        run: python scripts/build_spec_bundle.py
