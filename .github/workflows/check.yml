name: Check specification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-workflow.txt
      - name: Check Python syntax and undefined names
        run: python -m ruff check --isolated --no-cache --select E9,F63,F7,F82 scripts packages tests examples/engineering starter/common
      - name: Validate specification and examples
        run: python scripts/check_spec.py
      - name: Generate and check product declarations
        run: |
          python scripts/check_product_design.py --registry examples/development/product-registry.json --require-design
          python scripts/generate_product.py --registry examples/development/product-registry.json --output dist/generated-product
          python scripts/generate_product.py --registry examples/development/product-registry.json --output dist/generated-product --check
      - name: Build specification bundle
        run: python scripts/build_spec_bundle.py
      - name: Verify specification bundle
        shell: bash
        run: |
          spec_version=$(cat VERSION)
          python scripts/verify_spec_bundle.py --bundle "dist/tool-driver-cli-spec-${spec_version}.zip" --checksum "dist/tool-driver-cli-spec-${spec_version}.sha256"
      - name: Consume package and retain acceptance (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          spec_version=$(cat VERSION)
          browser=/opt/google/chrome/chrome
          if [ ! -x "$browser" ]; then
            browser=$(command -v chromium || command -v chromium-browser || command -v msedge)
          fi
          test -n "$browser"
          digest=$(cut -d ' ' -f1 "dist/tool-driver-cli-spec-${spec_version}.sha256")
          python scripts/check_graduation.py --audit --browser "$browser" --output dist/acceptance \
            --bundle "dist/tool-driver-cli-spec-${spec_version}.zip" --expected-sha256 "$digest"
      - name: Consume package and retain acceptance (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          spec_version=$(cat VERSION)
          browser='/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
          test -x "$browser" || { echo 'No preinstalled supported browser; independent consumption cannot be skipped.' >&2; exit 1; }
          digest=$(cut -d ' ' -f1 "dist/tool-driver-cli-spec-${spec_version}.sha256")
          python scripts/check_graduation.py --audit --browser "$browser" --output dist/acceptance \
            --bundle "dist/tool-driver-cli-spec-${spec_version}.zip" --expected-sha256 "$digest"
      - name: Consume package and retain acceptance (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $specVersion = (Get-Content VERSION).Trim()
          $candidates = @("$env:ProgramFiles/Google/Chrome/Application/chrome.exe", "${env:ProgramFiles(x86)}/Microsoft/Edge/Application/msedge.exe")
          $browser = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (!$browser) { throw 'No preinstalled supported browser; independent consumption cannot be skipped.' }
          $digest = (Get-Content "dist/tool-driver-cli-spec-$specVersion.sha256").Split(' ')[0]
          python scripts/check_graduation.py --audit --browser $browser --output dist/acceptance --bundle "dist/tool-driver-cli-spec-$specVersion.zip" --expected-sha256 $digest
      - name: Show package acceptance failures
        if: failure()
        shell: python
        run: |
          import json
          from pathlib import Path
          root = Path("dist/acceptance")
          report = root / "acceptance.json"
          if report.is_file():
              data = json.loads(report.read_text(encoding="utf-8"))
              print(json.dumps({key: data[key] for key in ("local_passed", "release_ready", "source_unchanged")}))
              for check in data["checks"]:
                  print(json.dumps(check))
                  if not check["passed"]:
                      for stream in ("stdout", "stderr"):
                          log = root / (check["id"] + "." + stream + ".log")
                          if log.is_file():
                              print(log.name + "\n" + log.read_text(encoding="utf-8", errors="replace")[-6000:])
              for log in sorted((root / "consumer").glob("*-stderr.log")):
                  print(log.name + "\n" + log.read_text(encoding="utf-8", errors="replace")[-6000:])
              for log in sorted((root / "consumer").glob("*-dom.html")):
                  print(log.name + "\n" + log.read_text(encoding="utf-8", errors="replace")[-6000:])
      - name: Retain exact package acceptance artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: specification-acceptance-${{ runner.os }}
          path: |
            dist/tool-driver-cli-spec-*.zip
            dist/tool-driver-cli-spec-*.manifest.json
            dist/tool-driver-cli-spec-*.sha256
            dist/acceptance/
          if-no-files-found: warn
