name: Release specification

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check release identity
        shell: bash
        run: |
          spec_version=$(cat VERSION)
          test "$GITHUB_REF_NAME" = "v${spec_version}"
          test "$(cat STATUS)" = stable
      - name: Install checking dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate specification
        run: python scripts/check_spec.py
      - name: Run command and delivery tests
        run: python -m unittest discover -s tests -v
      - name: Build and verify committed bundle
        shell: bash
        run: |
          spec_version=$(cat VERSION)
          python scripts/build_spec_bundle.py
          python scripts/verify_spec_bundle.py --bundle "dist/tool-driver-cli-spec-${spec_version}.zip" --checksum "dist/tool-driver-cli-spec-${spec_version}.sha256"
      - name: Publish immutable version assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          spec_version=$(cat VERSION)
          gh release create "$GITHUB_REF_NAME" \
            "dist/tool-driver-cli-spec-${spec_version}.zip" \
            "dist/tool-driver-cli-spec-${spec_version}.manifest.json" \
            "dist/tool-driver-cli-spec-${spec_version}.sha256" \
            --verify-tag --title "tool-driver-cli-spec ${spec_version}" \
            --notes-file docs/RELEASE-NOTES.md
