name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # The release gate is the merge gate: every check of check.yml, on Windows, macOS and Linux.
  checks:
    uses: ./.github/workflows/check.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install check dependencies
        run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - name: Tag must match VERSION and be annotated
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          test "$(git cat-file -t "${GITHUB_REF_NAME}")" = tag
      - name: Build bundle and notes
        run: |
          python scripts/build_spec_bundle.py
          python scripts/build_spec_bundle.py --notes > dist/notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" $prerelease --verify-tag \
            --title "tool-driver-cli-spec ${version}" --notes-file dist/notes.md \
            "dist/tool-driver-cli-spec-${version}.zip" "dist/tool-driver-cli-spec-${version}.sha256"
