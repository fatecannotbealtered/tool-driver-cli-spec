[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "{{NAME}}"
version = "{{VERSION}}"
description = "{{NAME}}: a driver CLI for AI agents ({{PROFILE}} mode)."
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.26", "referencing>=0.37"]

[project.scripts]
{{NAME}} = "{{PACKAGE}}.cli:main"

[tool.setuptools]
packages = ["{{PACKAGE}}"]

[tool.setuptools.package-data]
"{{PACKAGE}}" = ["generated/*.json", "generated/*.md"]
